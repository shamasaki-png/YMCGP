<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="アルコールチェック">
<title>アルコールチェック記録簿</title>
<link rel="stylesheet" href="style.css"></head><body><div class="w">
<div class="hd"><i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i><h1>アルコールチェック記録簿<small>本日も安全運転を心がけましょう( *´艸｀)</small></h1></div><div id="msg" class="sm"></div>

<div id="lg" class="card">
 <label>氏名</label><select id="nm"></select>
 <label>PIN</label><input type="password" id="pin" inputmode="numeric" autocomplete="off">
 <div style="margin-top:14px"><button class="pri" id="go" style="width:100%">ログイン</button></div>
 <details id="rg" style="margin-top:18px"><summary style="min-height:40px">初めての方：運転者名を登録する</summary>
  <label>運転者名</label><input type="text" id="rn" placeholder="例：山田 太郎">
  <label>PIN（数字4〜6桁・ご自身で決めてください）</label><input type="password" id="rp" inputmode="numeric" maxlength="6" autocomplete="off">
  <button id="rb" style="width:100%;margin-top:10px">登録してログイン</button>
 </details>
</div>

<div id="app" hidden>
 <div class="sm" style="display:flex;justify-content:space-between;align-items:center"><span id="who"></span><button id="out" class="sm" style="min-height:32px">ログアウト</button></div>
 <div class="tabs"><button id="t1" class="on">チェック入力</button><button id="t2">記録簿</button></div>

 <div id="p1"><div class="card">
  <div id="eb" hidden class="tag ng" style="display:block;margin-bottom:6px">修正中：送信すると記録が上書きされます　<button id="ec" style="min-height:32px">修正をやめる</button></div>
  <label>車両番号等（必須）</label><select id="veh"></select>
  <details id="vg"><summary>車両が見つからない：新しい車両を登録</summary>
   <input type="text" id="vn" placeholder="例：ハイエース 5-20" style="margin-top:6px">
   <button id="vb" style="width:100%;margin-top:8px">車両を登録</button></details>
  <label>確認日時（必須）</label><input type="datetime-local" id="at">
  <div class="row" style="margin-top:8px"><label><input type="radio" name="ty" value="運転前" checked>運転前</label><label><input type="radio" name="ty" value="運転後">運転後</label></div>
  <label>確認方法</label>
  <div class="row"><label><input type="radio" name="me" value="対面">対面</label><label><input type="radio" name="me" value="電話">電話</label><label><input type="radio" name="me" value="ビデオ通話">ビデオ通話</label><label><input type="radio" name="me" value="その他" checked>その他</label></div>
  <input type="text" id="mo" placeholder="その他の内容" style="margin-top:6px">
  <label>検知器の表示画面の写真（必須）</label><input type="file" id="ph" accept="image/*" capture="environment"><img id="th" hidden alt=""><div id="pd" class="sm" style="margin-top:6px"></div>
  <label>検知器の結果（mg/L）：写真から自動で読み取ります</label><input type="number" id="val" step="0.01" min="0" inputmode="decimal" placeholder="0.00"><div id="ocr" class="sm" style="margin-top:6px"></div>
  <label>酒気帯び（0.15mg/L以上で自動的に「有」）</label><div id="alv"><span class="tag">未判定</span></div>
  <div id="wn" class="tag ng" hidden style="margin-top:8px;display:block">酒気帯びの恐れあり。運転せず、管理者へ連絡してください。</div>
  <label>指示事項またはその他必要な事項</label><textarea id="note" rows="2"></textarea>
  <button class="pri" id="sub" style="width:100%;min-height:54px;margin-top:16px">記録を送信</button>
 </div><div class="sm" style="margin:16px 4px 6px;font-weight:600">あなたの直近の記録（管理者の確認状況）</div><div id="rec"></div></div>

 <div id="p2" hidden>
  <div class="card"><label>対象月</label><input type="month" id="fm">
   <label>状態</label><select id="fs"><option value="">すべて</option><option value="p">未確認</option><option value="a">酒気帯び有</option></select>
   <div id="sum" class="sm" style="margin-top:8px"></div></div>
  <div id="lst"></div>
 </div>
</div></div>

<div id="dn" hidden style="position:fixed;inset:0;z-index:9;background:rgba(23,50,59,.45);display:flex;align-items:center;justify-content:center;padding:24px"><div class="card" style="max-width:320px;width:100%;text-align:center;margin:0;padding:24px"><div style="width:56px;height:56px;margin:0 auto 10px;border-radius:50%;background:var(--ok2);color:var(--ok);display:grid;place-items:center;font-size:30px">✔</div><div style="font-size:20px;font-weight:700">送信完了</div><div class="sm" style="margin:6px 0 16px">記録を保存しました</div><button class="pri" id="dnb" style="width:100%">OK</button></div></div>
<script src="common.js"></script>
<script>
const pad=n=>String(n).padStart(2,'0'),val=n=>(document.querySelector(`input[name=${n}]:checked`)||{}).value||'';
const nowL=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`};
let rows=[],blob=null,editId=null;

$('#at').value=nowL();$('#fm').value=nowL().slice(0,7);
(async()=>{try{const j=await call('names');$('#nm').innerHTML=j.names.map(n=>`<option>${E(n)}</option>`).join('');$('#veh').innerHTML=j.vehicles.map(n=>`<option>${E(n)}</option>`).join('');if(!j.names.length)$('#rg').open=true;if(!j.vehicles.length)$('#vg').open=true;
 try{const o=JSON.parse(ls.g('u'));if(o){$('#nm').value=o.name;$('#pin').value=o.pin}}catch(e){}}catch(e){msg('接続できません：'+e.message,1)}})();
$('#go').onclick=async()=>{U={name:$('#nm').value,pin:$('#pin').value};try{const j=await call('login');U.admin=j.admin;ls.s('u',JSON.stringify({name:U.name,pin:U.pin}));$('#lg').hidden=true;$('#app').hidden=false;$('#who').textContent=U.name+(U.admin?'（管理者）':'');msg('');load()}catch(e){msg(e.message,1)}};
$('#vb').onclick=async()=>{const n=$('#vn').value.trim().replace(/\s+/g,' ');if(!n){msg('車両名（ナンバー等）を入力してください',1);return}
 try{await call('addveh',{vname:n});if(![...$('#veh').options].some(o=>o.value==n))$('#veh').add(new Option(n));$('#veh').value=n;$('#vn').value='';$('#vg').open=false;msg('車両を登録しました')}catch(e){msg(e.message,1)}};
$('#dnb').onclick=()=>{$('#dn').hidden=true;window.scrollTo(0,0)};
$('#out').onclick=()=>{ls.s('u','');location.reload()};
$('#rb').onclick=async()=>{const n=$('#rn').value.trim(),p=$('#rp').value.trim();
 if(!n||!/^\d{4,6}$/.test(p)){msg('運転者名と、数字4〜6桁のPINを入力してください',1);return}
 try{U={};await call('register',{rname:n,rpin:p});$('#nm').innerHTML+=`<option>${E(n)}</option>`;$('#nm').value=n;$('#pin').value=p;$('#go').click()}catch(e){msg(e.message,1)}};
const tab=t=>{$('#p1').hidden=t!=1;$('#p2').hidden=t!=2;$('#t1').className=t==1?'on':'';$('#t2').className=t==2?'on':'';if(t==2)load()};
$('#t1').onclick=()=>tab(1);$('#t2').onclick=()=>tab(2);
document.querySelectorAll('[name=me]').forEach(r=>r.onchange=()=>{$('#mo').hidden=val('me')!='その他'});
const DEF='アルコール検知器による測定結果の撮影画像を専用アプリにて報告';$('#mo').value=DEF;
const judge=()=>{const v=parseFloat($('#val').value),k=!isNaN(v);$('#alv').innerHTML=k?`<span class="tag ${v>=0.15?'ng':'ok'}">${v>=0.15?'有':'無'}</span>`:'<span class="tag">未判定</span>';$('#wn').hidden=!(k&&v>=0.15)};
$('#val').oninput=judge;

async function shrink(f){const b=await createImageBitmap(f),s=Math.min(1,1280/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*s);c.height=Math.round(b.height*s);c.getContext('2d').drawImage(b,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',.8))}
function exifDate(buf){try{const v=new DataView(buf);if(v.getUint16(0)!=0xFFD8)return '';let o=2;while(o+4<v.byteLength){const m=v.getUint16(o);if(m==0xFFDA)break;const L=v.getUint16(o+2);
 if(m==0xFFE1&&v.getUint32(o+4)==0x45786966){const t=o+10,le=v.getUint16(t)==0x4949,g=(p,s)=>s?v.getUint16(p,le):v.getUint32(p,le),
  ent=(ifd,tg)=>{const n=g(t+ifd,1);for(let i=0;i<n;i++){const e=t+ifd+2+i*12;if(g(e,1)==tg)return g(e+8,0)}return null},
  i0=g(t+4,0),ex=ent(i0,0x8769);let p=null;if(ex!=null)p=ent(ex,0x9003);if(p==null&&ex!=null)p=ent(ex,0x9004);if(p==null)p=ent(i0,0x0132);if(p==null)return '';
  let s='';for(let i=0;i<19;i++)s+=String.fromCharCode(v.getUint8(t+p+i));return s}
 o+=2+L}}catch(e){}return ''}
function photoDay(buf,f){const s=exifDate(buf);if(/^\d{4}:\d\d:\d\d/.test(s))return{d:s.slice(0,10).replace(/:/g,'-'),src:'撮影日'};if(f.lastModified){const d=new Date(f.lastModified);return{d:`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,src:'ファイル日付（撮影日不明）'}}return null}
let pday=null;
function dayCheck(pop){if(!pday||!blob)return;const rd=$('#at').value.slice(0,10),ok=pday.d==rd;
 $('#pd').innerHTML=ok?`✔ ${pday.src}：${pday.d}（確認日と一致）`:`<b style="color:var(--ng)">⚠ ${pday.src} ${pday.d} は、確認日 ${rd} と異なります</b>`;
 if(!ok&&pop)alert(`写真の${pday.src}（${pday.d}）が、確認日（${rd}）と一致しません。\n別の日の写真ではないか確認してください。\n（このまま送信することもできます）`)}
$('#at').onchange=()=>dayCheck(true);
let tj=null;const loadT=()=>tj||(tj=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';s.onload=()=>res(window.Tesseract);s.onerror=rej;document.head.appendChild(s)}));
async function readNum(f){const T=await loadT(),bm=await createImageBitmap(f),s=Math.min(1,1400/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=Math.round(bm.width*s);c.height=Math.round(bm.height*s);
 const x=c.getContext('2d');x.drawImage(bm,0,0,c.width,c.height);const im=x.getImageData(0,0,c.width,c.height),d=im.data,iv=x.createImageData(im);
 for(let i=0;i<d.length;i+=4){const g=.3*d[i]+.59*d[i+1]+.11*d[i+2];d[i]=d[i+1]=d[i+2]=g;iv.data[i]=iv.data[i+1]=iv.data[i+2]=255-g;iv.data[i+3]=255}
 x.putImageData(im,0,0);const c2=document.createElement('canvas');c2.width=c.width;c2.height=c.height;c2.getContext('2d').putImageData(iv,0,0);
 const w=await T.createWorker('eng');await w.setParameters({tessedit_char_whitelist:'0123456789.',tessedit_pageseg_mode:'11'});let r=null;
 for(const k of [c,c2]){const t=(await w.recognize(k)).data.text,m=t.match(/\d[.,]\d{2,3}/);if(m){r=parseFloat(m[0].replace(',','.'));break}}
 await w.terminate();return r}
$('#ph').onchange=async e=>{blob=null;pday=null;$('#th').hidden=true;$('#pd').textContent='';$('#ocr').textContent='';$('#val').value='';judge();const f=e.target.files[0];if(!f)return;
 try{pday=photoDay(await f.arrayBuffer(),f)}catch(x){}
 try{blob=await shrink(f)}catch(z){blob=f}
 $('#th').src=URL.createObjectURL(blob);$('#th').hidden=false;dayCheck(true);
 $('#ocr').textContent='写真から数値を読み取り中…（初回は少し時間がかかります）';
 try{const v=await readNum(blob);if(v!=null&&v<2){$('#val').value=v.toFixed(2);judge();$('#ocr').textContent=`写真から ${v.toFixed(2)} と読み取りました。検知器の表示と違う場合は修正してください。`}else{$('#ocr').textContent='数値を読み取れませんでした。写真を見て、手入力してください。'}}
 catch(x){$('#ocr').textContent='自動読み取りを利用できませんでした。手入力してください。'}};
const b64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});

function resetForm(){editId=null;$('#eb').hidden=true;$('#veh').selectedIndex=0;$('#at').value=nowL();document.querySelector('[name=ty][value=運転前]').checked=true;document.querySelector('[name=me][value=その他]').checked=true;
 $('#mo').hidden=false;$('#mo').value=DEF;$('#val').value='';$('#note').value='';$('#ph').value='';blob=null;pday=null;$('#th').hidden=true;$('#ocr').textContent='';$('#pd').textContent='';judge()}
$('#ec').onclick=resetForm;
$('#sub').onclick=async()=>{
 const d={veh:$('#veh').value,at:$('#at').value,ty:val('ty'),me:val('me'),mo:$('#mo').value.trim(),val:$('#val').value,note:$('#note').value.trim()};
 if(!d.veh||!d.at||(!blob&&!editId)){msg('車両・日時・検知器の表示画面の写真は必須です',1);return}
 $('#sub').disabled=true;msg('送信中…');
 try{if(blob)d.photo=await b64(blob);const ed=editId;if(ed){d.id=ed;await call('update',d)}else await call('add',d);
  resetForm();msg('');alert(ed?'✅ 送信完了\n\n修正内容を送信しました。':'✅ 送信完了\n\n一連の手続きが完了しました。');await load()}
 catch(e){msg('送信に失敗しました：'+e.message,1)}
 $('#sub').disabled=false};

const bad=c=>c.alc=='有';
function card(c){const ok=c.rv=='済',id=E(c.id);
 let st=ok?`<span class="tag ok">確認済</span> <span class="sm">確認者：${E(c.cf)}　${fmt(c.rt)}${c.rc?'　'+E(c.rc):''}</span>`:'<span class="tag">未確認（管理者の確認待ち）</span>',ac='';
 if(!ok){ac=`<button data-ed="${id}">修正</button> <button data-del="${id}">削除</button>`;if(c.rq=='許可済')st+=`<div class="sm">確認の取消が許可されました。修正・削除できます。${E(c.rp)}</div>`}
 else if(c.rq=='申請中')st+='<div class="sm">確認の取消を申請中です（管理者の許可待ち）</div>';
 else{ac=`<button data-rq="${id}">確認の取消を申請</button>`;if(c.rq=='却下')st+=`<div class="sm">取消申請は却下されました：${E(c.rp)}</div>`}
 return `<div class="card ${bad(c)?'bad':'good'}"><b>${E(c.veh)}</b>　${E(c.ty)} ${fmt(c.at)}<br>${E(c.me)}${c.mo?'['+E(c.mo)+']':''}<br>${c.val===''?'数値未入力':E(c.val)+' mg/L'}　酒気帯び <span class="tag ${c.alc=='有'?'ng':c.alc?'ok':''}">${E(c.alc||'未判定')}</span><br>${c.note?E(c.note)+'<br>':''}<div style="margin-top:6px">${c.ph?`<button data-ph="${id}">写真を表示</button> `:''}${ac}</div><div style="margin-top:8px">${st}</div></div>`}
function draw(){const s=rows.slice().sort((a,b)=>a.at<b.at?1:-1),m=$('#fm').value,t=$('#fs').value,
 l=s.filter(c=>(!m||c.at.startsWith(m))&&(!t||(t=='p'&&c.rv!='済')||(t=='a'&&bad(c))));
 $('#rec').innerHTML=s.slice(0,5).map(card).join('')||'<div class="sm">まだ記録はありません</div>';
 $('#sum').textContent=`${l.length}件／未確認 ${l.filter(c=>c.rv!='済').length}件／酒気帯び有 ${l.filter(bad).length}件`;
 $('#lst').innerHTML=l.map(card).join('')||'<div class="sm">該当する記録はありません</div>'}
async function load(){try{rows=(await call('list',{mine:1})).rows;draw()}catch(e){msg(e.message,1)}}
$('#fm').onchange=draw;$('#fs').onchange=draw;
async function act(e){const t=e.target,d=t.dataset;try{
 if(d.ph){t.textContent='読み込み中…';const j=await call('photo',{id:d.ph});t.outerHTML=`<img class="pi" src="${j.img}" alt="検知器">`}
 if(d.ed){const c=rows.find(x=>x.id==d.ed);editId=c.id;if(![...$('#veh').options].some(o=>o.value==c.veh))$('#veh').add(new Option(c.veh));$('#veh').value=c.veh;$('#at').value=c.at;
  document.querySelector(`[name=ty][value=${c.ty}]`).checked=true;const mr=document.querySelector(`[name=me][value=${c.me}]`);if(mr)mr.checked=true;$('#mo').hidden=c.me!='その他';$('#mo').value=c.mo;
  $('#val').value=c.val;judge();$('#note').value=c.note;$('#ph').value='';blob=null;$('#th').hidden=true;$('#eb').hidden=false;tab(1);window.scrollTo(0,0);msg('写真を変更しない場合は、そのまま送信できます')}
 if(d.del&&confirm('この記録を削除します。よろしいですか？')){await call('remove',{id:d.del});msg('削除しました');await load()}
 if(d.rq){const r=prompt('確認の取消を申請します。理由を入力してください');if(r){await call('reqcancel',{id:d.rq,reason:r});msg('取消を申請しました。管理者の許可をお待ちください');await load()}}
 }catch(x){msg(x.message,1)}}
$('#rec').onclick=act;$('#lst').onclick=act;
</script></body></html>
